# fly.toml app configuration file generated for polymath-tuter on 2026-11-16T14:13:32Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'polymath-tuter'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  POLYMATH_DATA_DIR = '/data'

[[mounts]]
  source = 'polymath_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
